# Publish a CI firmware build as a GitHub release (the badge's OTA source).
#
# Automatic: every successful `firmware` run from a push to `crystal` is
# published as release build-<N>, marked latest. Badges with Wi-Fi install the
# newest release whose build number is greater than their own (Ota.auto_tick),
# or on demand with shell `ota` / holding User B on the DIAG screen.
#
# The repository variable BADGE_RELEASES_ENABLED = true must be set (it is);
# unset it to stop all publishing.
#
# By hand (to republish an older run): Actions > badge-release > Run workflow,
# run_id = a successful `firmware` run, confirm = publish.
#
# Release assets (firmware/main/ota.c, tools/release.sh):
#   badge-app.bin       = crystal_blink.bin (the app image for the other OTA slot)
#   badge-version.txt   = "<git describe> <N>" (main/ota.c reads N)
name: badge-release

on:
  workflow_run:
    workflows: [firmware]
    types: [completed]
    branches: [crystal]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a successful 'firmware' workflow run to publish"
        required: true
      confirm:
        description: "Type 'publish' to publish the release"
        required: true

permissions:
  contents: read

concurrency:
  group: badge-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      vars.BADGE_RELEASES_ENABLED == 'true' && (
        (github.event_name == 'workflow_dispatch' && inputs.confirm == 'publish') ||
        (github.event_name == 'workflow_run' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'crystal'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.run_id }}
    steps:
      - name: Check the run
        run: |
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha \
            -q '[.workflowName, .conclusion, .headSha] | @tsv' > run.tsv
          read -r wf concl sha < run.tsv
          [ "$wf" = firmware ] || { echo "run $RUN_ID is '$wf', not firmware" >&2; exit 1; }
          [ "$concl" = success ] || { echo "run $RUN_ID: $concl" >&2; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - name: Download firmware artifact
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p 'badge-firmware-*' -D dl
          a=$(ls dl | grep -v -- '-debug$' | head -1)
          cp "dl/$a/crystal_blink.bin" badge-app.bin
          cp "dl/$a/badge-version.txt" badge-version.txt
          N=$(awk '{print $2}' badge-version.txt)
          case $N in ''|*[!0-9]*) echo "bad build number '$N'" >&2; exit 1 ;; esac
          [ "$(head -c1 badge-app.bin | od -An -tx1 | tr -d ' ')" = e9 ]
          [ "$(wc -c < badge-app.bin)" -le $((0x300000)) ]
          echo "N=$N" >> "$GITHUB_ENV"
      - name: Publish release
        run: |
          if gh release view "build-$N" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release build-$N already exists; nothing to do"
            exit 0
          fi
          gh release create "build-$N" -R "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "Badge firmware build $N" \
            --notes "Crystal badge firmware build $N ($SHA), from firmware run $RUN_ID. Install on a badge: shell \`ota\`, or hold User B on the DIAG screen." \
            badge-app.bin badge-version.txt
