# Publish a CI firmware build as a GitHub release (the badge's OTA source).
#
# DISABLED BY DEFAULT. Publishing a release is the user's decision: every badge
# with Wi-Fi installs the newest release whose build number is greater than its
# own, automatically when idle (a4e337c, Ota.auto_tick). Nothing runs this workflow automatically.
#
# To publish, all three are needed:
#   1. Repository variable BADGE_RELEASES_ENABLED = true
#      (Settings > Secrets and variables > Actions > Variables). Without it the
#      job is skipped.
#   2. Run it by hand: Actions > badge-release > Run workflow (or
#      `gh workflow run badge-release.yml -f run_id=<id> -f confirm=publish`).
#      GitHub lists workflow_dispatch workflows only once the file is on the
#      default branch.
#   3. Inputs: run_id = a successful `firmware` workflow run (its artifact
#      badge-firmware-<build> is published), confirm = publish.
#
# The release is tagged build-<N> at the run's commit, marked latest, with the
# assets the badge fetches (firmware/main/ota.c, tools/release.sh):
#   badge-app.bin       = crystal_blink.bin (the app image for the other OTA slot)
#   badge-version.txt   = "<git describe> <N>" (main/ota.c reads N)
name: badge-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of a successful 'firmware' workflow run to publish"
        required: true
      confirm:
        description: "Type 'publish' to publish the release"
        required: true

permissions:
  contents: read

jobs:
  release:
    if: vars.BADGE_RELEASES_ENABLED == 'true' && inputs.confirm == 'publish'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Check the run
        run: |
          gh run view "$RUN_ID" -R "$GITHUB_REPOSITORY" --json workflowName,conclusion,headSha \
            -q '[.workflowName, .conclusion, .headSha] | @tsv' > run.tsv
          read -r wf concl sha < run.tsv
          [ "$wf" = firmware ] || { echo "run $RUN_ID is '$wf', not firmware" >&2; exit 1; }
          [ "$concl" = success ] || { echo "run $RUN_ID: $concl" >&2; exit 1; }
          echo "SHA=$sha" >> "$GITHUB_ENV"
      - name: Download firmware artifact
        run: |
          gh run download "$RUN_ID" -R "$GITHUB_REPOSITORY" -p 'badge-firmware-*' -D dl
          a=$(ls dl | grep -v -- '-debug$' | head -1)
          cp "dl/$a/crystal_blink.bin" badge-app.bin
          cp "dl/$a/badge-version.txt" badge-version.txt
          N=$(awk '{print $2}' badge-version.txt)
          case $N in ''|*[!0-9]*) echo "bad build number '$N'" >&2; exit 1 ;; esac
          [ "$(head -c1 badge-app.bin | od -An -tx1 | tr -d ' ')" = e9 ]
          [ "$(wc -c < badge-app.bin)" -le $((0x300000)) ]
          echo "N=$N" >> "$GITHUB_ENV"
      - name: Publish release
        run: |
          gh release create "build-$N" -R "$GITHUB_REPOSITORY" --target "$SHA" --latest \
            --title "Badge firmware build $N" \
            --notes "Crystal badge firmware build $N ($SHA), from firmware run $RUN_ID. Install on a badge: shell \`ota\`, or hold User B on the DIAG screen." \
            badge-app.bin badge-version.txt
